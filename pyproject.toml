[project]
name = "scansible"
version = "0.1.2"
description = "Static Analysis Framework for Ansible"
authors = [{ name = "Ruben Opdebeeck", email = "ropdebee@vub.be" }]
requires-python = ">=3.13, <4"
dependencies = [
    "click>=8.1.3,<9",
    "pydantic>=2.11.7,<3",
    "loguru>=0.6.0,<0.7",
    "Jinja2>=3.1.2,<4",
    "rich==13.4.2",
    "graphviz>=0.21,<0.22",
    "MarkupSafe==2.0.1",
    "pyyaml>=6.0.1,<7",
    "requests>=2.32.3,<3",
    "ansible-core<3",
    "ansible", # Needed for collections.
    "kuzu>=0.10.0",
    "rustworkx>=0.16.0",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
scansible = "scansible:cli"

[dependency-groups]
dev = [
    "hypothesis>=6.17.0,<7",
    "pytest>=7.2.0,<8",
    "pytest-describe>=2.0.1,<3",
    "coverage>=6.5.0,<7",
    "pytest-cov>=4.0.0,<5",
    "pytest-mock>=3.10.0,<4",
    "ruff>=0.15.21",
    "basedpyright>=1.39.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["ALL"]
extend-ignore = [
    # F403/F405 complain about star imports and being unable to resolve them,
    # ignore these as they're handled properly by basedpyright
    "F403", "F405",
    # RUF022 complains about sorting of __all__, but we want to keep a grouping.
    "RUF022",
    # TRY004 wants us to use TypeError in Pydantic validators but those don't get caught by Pydantic
    "TRY004",
    # Warns of Any usage, already covered by Basedpyright
    "ANN401",
    # Confuses loguru logger with standard one
    "PLE1205",
    # Ignore docstrings for now
    "D",
    # Relative imports are our convention
    "TID252",
    # Overkill, wants exception messages moved into a variable or custom exception class
    "TRY003", "EM101", "EM102",
    # False positives galore: flags unused params required by external interfaces
    "ARG002", "ARG003",
    # tuple subclasses can't define __slots__ for extra attributes (CPython restriction)
    "SLOT001",
    # Various unnecessary ones.
    "DTZ005", "S101", "COM812", "CPY", "FIX", "ISC003", "G004", "E501", "TD003", "TD002", "TD001", "TC006",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D", "INP001", "S", "PLR2004", "FBT001", "ANN201", "ANN202", "PLR0915", "C901"]
"!**/tests/*" = ["PT"]
"scripts/*" = ["INP001"]
"src/scansible/utils/module_type_info.py" = ["ERA001"]
"src/scansible/pdg/canonical.py" = ["ERA001"]
# PLC0415: commands import lazily for startup performance;
# PLR0913/PLR0917: one CLI flag per parameter is the interface, not accidental complexity
"src/scansible/__init__.py" = ["PLC0415", "PLR0913", "PLR0917"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false
section-order = ["future", "typing", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
typing = ["typing", "typing_extension"]

[tool.pyright]
stubPath = "./lib/stubs"
typeCheckingMode = "recommended"
useLibraryCodeForTypes = true
reportImportCycles = "none"

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report html"
markers = [
    "slow: marks tests as slow (run with --slow)",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "^\\s*if TYPE_CHECKING:",
    "@overload",
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError\\(",
    "raise TypeError\\(",
    "raise ValueError\\(",
    "raise RuntimeError\\(",
    "@pytest\\.mark\\.xfail",
    "@pytest\\.mark\\.integration",
    "@pytest\\.mark\\.smoke",
    "def __repr__\\(",
]
